<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản trị - Dũng Kiều Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Roboto', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- PHẦN 1: LOGIN FORM -->
    <div id="loginSection" class="flex items-center justify-center min-h-screen relative">
        <a href="index.html" class="absolute top-6 left-6 flex items-center gap-2 text-gray-600 hover:text-black font-bold transition">
            <i class="fas fa-home"></i> Về trang chủ
        </a>
        <div class="bg-white p-8 rounded-xl shadow-lg w-96 border border-gray-100">
            <div class="text-center mb-6">
                <i class="fas fa-user-shield text-4xl text-[#5bb6d0] mb-2"></i>
                <h2 class="text-2xl font-bold text-gray-800">Quản trị viên</h2>
            </div>
            <form id="loginForm" class="space-y-4">
                <input type="email" id="email" class="w-full border rounded p-3" placeholder="Email admin">
                <input type="password" id="password" class="w-full border rounded p-3" placeholder="Mật khẩu">
                <button type="submit" class="w-full bg-[#5bb6d0] text-white py-3 rounded font-bold hover:bg-blue-600">Đăng nhập</button>
            </form>
        </div>
    </div>

    <!-- PHẦN 2: DASHBOARD -->
    <div id="dashboardSection" class="hidden">
        <header class="bg-white shadow px-6 py-4 flex justify-between items-center sticky top-0 z-50">
            <h1 class="text-xl font-bold text-[#5bb6d0]">Dũng Kiều Admin</h1>
            <div class="flex items-center gap-4">
                <span id="adminEmail" class="text-gray-600"></span>
                <button onclick="window.handleLogout()" class="text-red-500 hover:font-bold">Đăng xuất</button>
            </div>
        </header>

        <div class="max-w-7xl mx-auto p-6">
            <!-- Tabs -->
            <div class="flex gap-4 mb-6 border-b">
                <button onclick="switchTab('orders')" id="tabOrders" class="pb-2 px-4 border-b-2 border-[#5bb6d0] font-bold text-[#5bb6d0]">Quản lý Đơn hàng</button>
                <button onclick="switchTab('products')" id="tabProducts" class="pb-2 px-4 border-b-2 border-transparent text-gray-500 hover:text-black">Quản lý Sản phẩm</button>
                <button onclick="switchTab('stats')" id="tabStats" class="pb-2 px-4 border-b-2 border-transparent text-gray-500 hover:text-black">Báo cáo & Thống kê</button>
            </div>

            <!-- PANEL 1: ĐƠN HÀNG -->
            <div id="ordersPanel">
                <div class="bg-white rounded-xl shadow overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 border-b">
                            <tr>
                                <th class="p-4">Ngày đặt</th>
                                <th class="p-4">Khách hàng</th>
                                <th class="p-4">Tổng tiền</th>
                                <th class="p-4">Trạng thái</th>
                                <th class="p-4 text-right">Chi tiết</th>
                            </tr>
                        </thead>
                        <tbody id="orderList" class="divide-y"></tbody>
                    </table>
                </div>
            </div>

            <!-- PANEL 2: SẢN PHẨM -->
            <div id="productsPanel" class="hidden">
                <div class="flex justify-between mb-4">
                    <h2 class="text-lg font-bold">Tất cả sản phẩm</h2>
                    <button onclick="window.openAddModal()" class="bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700">+ Thêm món mới</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4" id="adminProductList"></div>
            </div>

            <!-- PANEL 3: THỐNG KÊ -->
            <div id="statsPanel" class="hidden space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-xl border-l-4 border-blue-500 shadow-sm">
                        <p class="text-gray-500 text-sm uppercase font-bold">Tổng doanh thu</p>
                        <p class="text-3xl font-bold text-gray-800 mt-2" id="statRevenue">0đ</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl border-l-4 border-green-500 shadow-sm">
                        <p class="text-gray-500 text-sm uppercase font-bold">Đơn thành công</p>
                        <p class="text-3xl font-bold text-gray-800 mt-2" id="statOrders">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl border-l-4 border-orange-500 shadow-sm">
                        <p class="text-gray-500 text-sm uppercase font-bold">Đã bán</p>
                        <p class="text-3xl font-bold text-gray-800 mt-2" id="statSoldItems">0</p>
                    </div>
                </div>
                <!-- Bảng cảnh báo và top sale -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-white border rounded-xl shadow-sm">
                        <div class="bg-red-50 px-6 py-4 border-b border-red-100 font-bold text-red-700">CẢNH BÁO SẮP HẾT (< 5)</div>
                        <table class="w-full text-left"><tbody id="lowStockList" class="divide-y text-sm"></tbody></table>
                    </div>
                    <div class="bg-white border rounded-xl shadow-sm">
                        <div class="bg-blue-50 px-6 py-4 border-b border-blue-100 font-bold text-blue-800">TOP BÁN CHẠY</div>
                        <table class="w-full text-left"><tbody id="topSellingList" class="divide-y text-sm"></tbody></table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL ĐƠN HÀNG -->
    <div id="orderModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg w-full max-w-2xl max-h-[90vh] overflow-y-auto m-4 p-6">
            <div class="flex justify-between items-start mb-4">
                <h3 class="text-xl font-bold">Chi tiết đơn hàng</h3>
                <button onclick="document.getElementById('orderModal').classList.add('hidden')" class="text-2xl">&times;</button>
            </div>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- MODAL SẢN PHẨM (FORM NHẬP) -->
    <div id="productModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg w-full max-w-2xl max-h-[90vh] overflow-y-auto m-4 p-6">
            <h3 id="modalTitle" class="text-xl font-bold mb-4">Thêm món mới</h3>
            <form id="productForm" class="space-y-4">
                <input type="hidden" id="prodId">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold mb-1">Tên sản phẩm</label>
                        <input type="text" id="prodName" required class="w-full border rounded p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">Danh mục</label>
                        <select id="prodCat" class="w-full border rounded p-2">
                            <option value="ca-1-nang">Cá 1 Nắng</option>
                            <option value="ca-kho">Cá Khô</option>
                            <option value="muc-kho">Mực Khô</option>
                            <option value="muc-1-nang">Mực 1 Nắng</option>
                            <option value="tom-kho">Tôm Khô</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold mb-1">Giá bán</label>
                        <input type="number" id="prodPrice" required class="w-full border rounded p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1 text-red-600">Tồn kho</label>
                        <input type="number" id="prodQty" required class="w-full border rounded p-2 bg-red-50" placeholder="100">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Quy cách</label>
                    <input type="text" id="prodWeight" value="1 kg" class="w-full border rounded p-2">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Link ảnh chính</label>
                    <input type="url" id="prodImage" required class="w-full border rounded p-2">
                </div>
                <details class="border rounded p-2 bg-gray-50">
                    <summary class="cursor-pointer font-bold text-sm text-gray-600">Ảnh phụ</summary>
                    <div class="mt-2 space-y-2">
                        <input type="url" id="prodImg1" placeholder="Ảnh phụ 1" class="w-full border rounded p-2 text-sm">
                        <input type="url" id="prodImg2" placeholder="Ảnh phụ 2" class="w-full border rounded p-2 text-sm">
                        <input type="url" id="prodImg3" placeholder="Ảnh phụ 3" class="w-full border rounded p-2 text-sm">
                    </div>
                </details>
                <div>
                    <label class="block text-sm font-bold mb-1">Mô tả</label>
                    <textarea id="prodDesc" rows="3" class="w-full border rounded p-2"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="document.getElementById('productModal').classList.add('hidden')" class="px-4 py-2 border rounded">Hủy</button>
                    <button type="submit" class="bg-[#5bb6d0] text-white px-6 py-2 rounded hover:bg-blue-600 font-bold">Lưu lại</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script type="module">
        import * as API from "./api.js";

        let allProductsData = []; // BIẾN QUAN TRỌNG ĐỂ LƯU SẢN PHẨM

        // ĐĂNG XUẤT
        window.handleLogout = async () => {
            await API.logout();
            window.location.reload();
        };

        // 1. KIỂM TRA ĐĂNG NHẬP
        API.checkLoginStatus((user) => {
            const ADMIN_EMAILS = ["dautay221156@gmail.com", "admin@dungkieu.com"];
            if (user) {
                if (!ADMIN_EMAILS.includes(user.email)) {
                    alert("Không có quyền Admin!");
                    API.logout();
                    window.location.href = "index.html";
                    return;
                }
                document.getElementById("loginSection").classList.add("hidden");
                document.getElementById("dashboardSection").classList.remove("hidden");
                document.getElementById("adminEmail").innerText = user.email;
                loadOrders(); // Load mặc định
            } else {
                document.getElementById("loginSection").classList.remove("hidden");
                document.getElementById("dashboardSection").classList.add("hidden");
            }
        });

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            try {
                await API.login(document.getElementById("email").value.trim(), document.getElementById("password").value);
            } catch (error) { alert("Sai thông tin!"); }
        });

        // 2. QUẢN LÝ ĐƠN HÀNG
        async function loadOrders() {
            const tbody = document.getElementById("orderList");
            tbody.innerHTML = "<tr><td colspan='5' class='text-center p-4'>Đang tải...</td></tr>";
            try {
                const orders = await API.getAllOrders();
                tbody.innerHTML = "";
                if(orders.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='5' class='text-center p-4'>Chưa có đơn hàng.</td></tr>"; return;
                }
                orders.forEach(order => {
                    const total = new Intl.NumberFormat('vi-VN').format(order.total_price);
                    const date = order.created_at_web ? new Date(order.created_at_web).toLocaleString('vi-VN') : 'N/A';
                    let statusTxt = order.status === 'shipped' ? `<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-bold">Đã giao</span>` : `<span class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded text-xs font-bold">Chờ xử lý</span>`;
                    
                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-4">${date}</td>
                            <td class="p-4 font-bold">${order.user_info.name}<br><span class="font-normal text-xs text-gray-500">${order.user_info.phone}</span></td>
                            <td class="p-4 font-bold text-red-600">${total}đ</td>
                            <td class="p-4">${statusTxt}</td>
                            <td class="p-4 text-right">
                                <button onclick="window.viewOrder('${encodeURIComponent(JSON.stringify(order))}')" class="text-blue-600 font-bold hover:underline">Chi tiết</button>
                            </td>
                        </tr>`;
                });
            } catch (e) { console.error(e); }
        }

        window.viewOrder = function(str) {
            const order = JSON.parse(decodeURIComponent(str));
            const modalContent = document.getElementById("modalContent");
            const isPaid = order.payment_status === 'paid';
            
            let payUI = isPaid ? `<span class="text-green-600 font-bold">✅ Đã thanh toán</span>` : `<div class="flex items-center gap-2"><span class="text-red-500 font-bold">❌ Chưa thanh toán</span><button onclick="window.confirmPay('${order.id}')" class="bg-blue-600 text-white px-2 py-1 rounded text-xs">Xác nhận đã nhận tiền</button></div>`;
            
            let itemsHtml = order.items.map(i => `<div class="flex justify-between border-b pb-2 mb-2"><div class="flex gap-2"><img src="${i.image}" class="w-10 h-10 rounded"><div><p class="font-bold text-sm">${i.name}</p><p class="text-xs">x${i.quantity}</p></div></div><p class="font-bold">${(i.price * i.quantity).toLocaleString()}đ</p></div>`).join('');

            modalContent.innerHTML = `
                <div class="grid grid-cols-2 gap-4 text-sm mb-4">
                    <div><p class="text-gray-500">Khách:</p><p class="font-bold">${order.user_info.name}</p><p>${order.user_info.phone}</p></div>
                    <div><p class="text-gray-500">Địa chỉ:</p><p>${order.user_info.address}</p></div>
                </div>
                <div class="bg-gray-50 p-3 rounded mb-4 flex justify-between items-center text-sm"><span class="font-bold text-gray-600">Thanh toán:</span>${payUI}</div>
                <div class="max-h-40 overflow-y-auto pr-2 mb-4">${itemsHtml}</div>
                <div class="text-right text-xl font-bold text-red-600 border-t pt-2">Tổng: ${order.total_price.toLocaleString()}đ</div>
                <div class="mt-6 flex justify-end gap-3 border-t pt-4">
                    <button onclick="document.getElementById('orderModal').classList.add('hidden')" class="px-4 py-2 border rounded hover:bg-gray-100">Đóng</button>
                    ${order.status === 'pending' ? `<button onclick="window.updateStatus('${order.id}','shipped')" class="bg-green-600 text-white px-4 py-2 rounded font-bold hover:bg-green-700">🚚 Giao hàng</button>` : `<span class="px-4 py-2 bg-gray-100 text-gray-500 font-bold rounded">Đã hoàn tất</span>`}
                </div>`;
            document.getElementById("orderModal").classList.remove("hidden");
        }

        window.confirmPay = async (id) => { if(confirm("Xác nhận đã nhận tiền?")) { await API.updatePaymentStatus(id, 'paid'); alert("Đã cập nhật!"); document.getElementById('orderModal').classList.add('hidden'); loadOrders(); } }
        window.updateStatus = async (id, st) => { if(confirm("Xác nhận giao hàng?")) { await API.updateOrderStatus(id, st); alert("Đã cập nhật!"); document.getElementById('orderModal').classList.add('hidden'); loadOrders(); } }

        // 3. QUẢN LÝ SẢN PHẨM
        async function loadAdminProducts() {
            const container = document.getElementById("adminProductList");
            container.innerHTML = "<p class='col-span-4 text-center'>Đang tải...</p>";
            try {
                allProductsData = await API.getAllProducts();
                container.innerHTML = "";
                allProductsData.forEach(p => {
                    // Xử lý ảnh lỗi
                    let imgSrc = p.image && p.image !== "undefined" ? p.image : "https://placehold.co/300x200?text=No+Image";
                    
                    container.innerHTML += `
                        <div class="bg-white p-4 rounded-xl shadow border border-gray-100 flex flex-col">
                            <img src="${imgSrc}" onerror="this.src='https://placehold.co/300x200?text=Error'" class="w-full h-40 object-cover rounded-lg mb-3 bg-gray-100">
                            <h3 class="font-bold text-gray-800 line-clamp-1">${p.name}</h3>
                            <p class="text-red-600 font-bold mb-2">${p.price.toLocaleString()}đ</p>
                            <div class="mt-auto flex gap-2">
                                <button onclick="window.openEditModal('${p.id}')" class="flex-1 bg-blue-50 text-blue-600 py-2 rounded font-bold hover:bg-blue-100 text-sm">Sửa</button>
                                <button onclick="window.deleteProduct('${p.id}')" class="flex-1 bg-red-50 text-red-600 py-2 rounded font-bold hover:bg-red-100 text-sm">Xóa</button>
                            </div>
                        </div>`;
                });
            } catch (e) { console.error(e); }
        }

        // HÀM MỞ MODAL SỬA - QUAN TRỌNG NHẤT
        window.openEditModal = function(id) {
            console.log("Bấm nút sửa ID:", id); // Log để kiểm tra
            const p = allProductsData.find(item => item.id === id);
            
            if (!p) { alert("Lỗi: Không tìm thấy sản phẩm!"); return; }

            document.getElementById("prodId").value = p.id;
            document.getElementById("prodName").value = p.name;
            document.getElementById("prodCat").value = p.categoryId || "ca-1-nang";
            document.getElementById("prodPrice").value = p.price;
            document.getElementById("prodQty").value = (p.quantity !== undefined) ? p.quantity : 0;
            document.getElementById("prodWeight").value = p.weight || "1 kg";
            document.getElementById("prodImage").value = p.image;
            document.getElementById("prodDesc").value = p.description || "";
            document.getElementById("prodImg1").value = p.image1 || "";
            document.getElementById("prodImg2").value = p.image2 || "";
            document.getElementById("prodImg3").value = p.image3 || "";

            document.getElementById("modalTitle").innerText = "Cập nhật: " + p.name;
            document.getElementById("productModal").classList.remove("hidden");
        }

        window.openAddModal = function() {
            document.getElementById("productForm").reset();
            document.getElementById("prodId").value = "";
            document.getElementById("modalTitle").innerText = "Thêm món mới";
            document.getElementById("productModal").classList.remove("hidden");
        }

        document.getElementById("productForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = document.getElementById("prodId").value;
            const data = {
                name: document.getElementById("prodName").value,
                categoryId: document.getElementById("prodCat").value,
                price: Number(document.getElementById("prodPrice").value),
                quantity: Number(document.getElementById("prodQty").value),
                weight: document.getElementById("prodWeight").value,
                image: document.getElementById("prodImage").value,
                description: document.getElementById("prodDesc").value,
                image1: document.getElementById("prodImg1").value,
                image2: document.getElementById("prodImg2").value,
                image3: document.getElementById("prodImg3").value
            };
            try {
                if (id) await API.updateProduct(id, data); else await API.addProduct(data);
                alert("Thành công!");
                document.getElementById("productModal").classList.add("hidden");
                loadAdminProducts();
            } catch (e) { alert("Lỗi: " + e.message); }
        });

        window.deleteProduct = async (id) => { if(confirm("Xóa là mất luôn nha!")) { await API.deleteProduct(id); loadAdminProducts(); } }

        // 4. THỐNG KÊ
        async function loadStatistics() {
            const products = await API.getAllProducts();
            const orders = await API.getAllOrders();
            let rev = 0, success = 0, soldCount = {};
            orders.forEach(o => {
                if (o.status !== 'cancelled') {
                    rev += o.total_price; success++;
                    o.items.forEach(i => { soldCount[i.name] = (soldCount[i.name] || 0) + i.quantity; });
                }
            });
            document.getElementById("statRevenue").innerText = rev.toLocaleString() + "đ";
            document.getElementById("statOrders").innerText = success;
            
            // Cảnh báo hết hàng
            const lowList = document.getElementById("lowStockList"); lowList.innerHTML = "";
            products.forEach(p => {
                if ((p.quantity || 0) < 5) lowList.innerHTML += `<tr><td class="p-3">${p.name}</td><td class="p-3 text-red-600 font-bold">${p.quantity||0}</td><td class="p-3 text-right"><button onclick="switchTab('products')" class="text-blue-500 underline">Nhập</button></td></tr>`;
            });

            // Top bán chạy
            const topList = document.getElementById("topSellingList"); topList.innerHTML = "";
            Object.entries(soldCount).sort((a,b)=>b[1]-a[1]).forEach(([name, qty]) => {
                topList.innerHTML += `<tr><td class="p-3">${name}</td><td class="p-3 text-center font-bold">${qty}</td><td class="p-3 text-right">-</td></tr>`;
            });
        }

        // TAB SWITCHER
        window.switchTab = function(tab) {
            ['orders','products','stats'].forEach(t => document.getElementById(t+'Panel').classList.add('hidden'));
            document.getElementById(tab+'Panel').classList.remove('hidden');
            
            ['tabOrders','tabProducts','tabStats'].forEach(t => document.getElementById(t).className = "pb-2 px-4 border-b-2 border-transparent text-gray-500 hover:text-black");
            document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).className = "pb-2 px-4 border-b-2 border-[#5bb6d0] font-bold text-[#5bb6d0]";

            if(tab === 'orders') loadOrders();
            if(tab === 'products') loadAdminProducts();
            if(tab === 'stats') loadStatistics();
        }
    </script>
</body>
</html>
