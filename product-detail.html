<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Chi tiết sản phẩm </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .font-script { font-family: 'Pinyon Script', cursive; }
        .font-serif-viet { font-family: 'Lora', serif; }
        .font-body { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body class="font-body bg-[#fdfbf7] text-gray-800 flex flex-col min-h-screen">

    <!-- BANNER (GIỐNG HÌNH CANVA) -->
   <!-- BANNER (ĐÃ SỬA CHIỀU CAO TỰ ĐỘNG) -->
    <!-- Sửa: h-[300px] thành min-h-[300px] hoặc h-auto py-20 -->
    <!-- BANNER SẢN PHẨM (ĐÃ CHỈNH KHÍT LẠI GIỐNG TRANG CHỦ) -->
    <!-- Giảm chiều cao xuống h-[350px] cho gọn -->
    <header class="relative w-full h-[350px] bg-cover bg-center flex flex-col justify-center items-center text-center text-white" 
            style="background-image: url('https://i.postimg.cc/4NbMH428/ocean.jpg');">
        
        <div class="absolute inset-0 bg-blue-900/40"></div>
        
        <div class="relative z-10 px-4 flex flex-col items-center justify-center">
            
            <!-- Dòng 1: Nhỏ lại xíu -->
            <p class="text-xs md:text-base uppercase tracking-[0.3em] mb-1 text-gray-200">Chào mừng bạn đến với</p>
            
            <!-- Dòng 2: Tên Shop -->
            <h1 class="text-6xl md:text-9xl font-script mb-2 drop-shadow-xl">Dũng Kiều</h1>
            
            <!-- Dòng 3: Slogan (Giảm margin bottom từ mb-8 xuống mb-5) -->
            <p class="text-xs md:text-base uppercase tracking-[0.2em] font-bold border-t border-b border-white/50 py-2 mb-5">
                Cửa hàng hải sản khô và 1 nắng
            </p>
            
            <!-- Dòng 4: Danh mục (Làm nhỏ lại cho tinh tế) -->
            <h3 class="text-xl md:text-2xl font-serif-viet font-bold uppercase tracking-wide bg-white/20 backdrop-blur-md border border-white/30 px-6 py-2 rounded-full shadow-lg">
                Chi tiết sản phẩm
            </h3>
            
        </div>
    </header>

    <!-- MENU -->
    <!-- MENU RESPONSIVE (XỊN XÒ) -->
    <nav class="bg-[#5bb6d0] text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center py-3">
                
                <!-- Logo / Tên Shop (Luôn hiện) -->
                <a href="index.html" class="text-2xl font-script font-bold">Dũng Kiều</a>

                <!-- Nút 3 gạch (Chỉ hiện trên Mobile) -->
                <button onclick="document.getElementById('mobileMenu').classList.toggle('hidden')" class="md:hidden focus:outline-none">
                    <i class="fas fa-bars text-2xl"></i>
                </button>

                <!-- Menu Desktop (Ẩn trên Mobile, Hiện trên Máy tính) -->
                <!-- Menu Desktop -->
                <ul class="hidden md:flex space-x-8 text-xl font-script items-center">
                    <li><a href="index.html" class="hover:text-gray-100 transition">Trang chủ</a></li>
                    <li><a href="products.html" class="font-bold border-b-2 border-white transition">Sản phẩm</a></li>
                    <li><a href="cart.html" class="hover:text-gray-100 transition">Giỏ hàng</a></li>
                    <li><a href="order-history.html" class="hover:text-gray-100 transition">Lịch sử đơn</a></li>
                    <li id="userLink_Desktop">
                        <a href="login.html" class="hover:text-gray-100 transition">Đăng nhập/Đăng ký</a>
                    </li>
                </ul>
            </div>

            <!-- Menu Mobile (Xổ xuống khi bấm nút) -->
            <div id="mobileMenu" class="hidden md:hidden pb-4 border-t border-white/20">
                <ul class="flex flex-col space-y-3 mt-3 text-lg font-script text-center">
                    <li><a href="index.html" class="block hover:bg-white/20 py-1 rounded">Trang chủ</a></li>
                    <li><a href="products.html" class="block hover:bg-white/20 py-1 rounded">Sản phẩm</a></li>
                    <li><a href="cart.html" class="block hover:bg-white/20 py-1 rounded">Giỏ hàng</a></li>
                    <li><a href="order-history.html" class="block hover:bg-white/20 py-1 rounded">Lịch sử đơn</a></li>
                    <li id="userLink_Mobile">
                        <a href="login.html" class="block bg-white text-[#5bb6d0] mx-10 py-1 rounded-full font-bold">Đăng nhập</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- NỘI DUNG CHI TIẾT -->
    <main class="max-w-6xl mx-auto px-4 py-10">
        
        <!-- Nút quay lại -->
        <button onclick="history.back()" class="mb-6 flex items-center text-gray-500 hover:text-black transition">
            <i class="fas fa-arrow-left mr-2"></i> Quay lại
        </button>

        <div id="detailContainer" class="grid grid-cols-1 md:grid-cols-2 gap-12 bg-white p-8 rounded-3xl shadow-sm">
            <div class="text-center">Đang tải chi tiết...</div>
        </div>

    </main>

    <script type="module">
        import * as API from "./api.js";
        import * as Cart from "./cart.js";
        window.Cart = Cart;
 // --- 1. XỬ LÝ ĐĂNG NHẬP / ĐỔI MENU ---
    // --- 1. XỬ LÝ ĐĂNG NHẬP / ĐỔI MENU (CODE CHUẨN CHO CẢ MOBILE & DESKTOP) ---
    API.checkLoginStatus((user) => {
        // Lấy cả 2 cái menu (Máy tính và Điện thoại)
        const userLinkDesktop = document.getElementById("userLink_Desktop");
        const userLinkMobile = document.getElementById("userLink_Mobile");

        if (user) {
            const name = user.email.split('@')[0];

            // 1. CẬP NHẬT MENU MÁY TÍNH
            if (userLinkDesktop) {
                userLinkDesktop.innerHTML = `
                    <div class="relative group cursor-pointer h-full flex items-center">
                        <span class="font-bold border-b border-transparent group-hover:border-white pb-1">
                            Chào, ${name}
                        </span>
                        <!-- MENU THẢ XUỐNG -->
                        <div class="absolute right-0 top-full pt-4 w-56 hidden group-hover:block z-50">
                            <div class="bg-white text-black shadow-xl rounded-lg overflow-hidden border border-gray-100">
                                <div class="absolute -top-2 right-4 w-4 h-4 bg-white transform rotate-45 border-l border-t border-gray-100"></div>
                                <a href="order-history.html" class="block px-4 py-3 hover:bg-gray-50 border-b flex items-center gap-2">
                                    <i class="fas fa-box text-[#5bb6d0]"></i> Đơn hàng của tui
                                </a>
                                <button onclick="window.handleLogout()" class="block w-full text-left px-4 py-3 hover:bg-red-50 text-red-600 font-bold flex items-center gap-2">
                                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // 2. CẬP NHẬT MENU ĐIỆN THOẠI (Làm đơn giản hơn cho đỡ rối)
            if (userLinkMobile) {
                userLinkMobile.innerHTML = `
                    <div class="flex flex-col gap-2">
                        <span class="text-gray-500 text-sm">Chào, ${name}</span>
                        <button onclick="window.handleLogout()" class="bg-red-500 text-white py-1 px-4 rounded-full font-bold mx-auto">Đăng xuất</button>
                    </div>
                `;
            }

            // Hàm đăng xuất chung
            window.handleLogout = async () => {
                await API.logout();
                window.location.reload();
            }

        } else {
            // CHƯA ĐĂNG NHẬP -> HIỆN NÚT LOGIN NHƯ CŨ
            const loginHTML = `<a href="login.html" class="hover:text-gray-100 transition">Đăng nhập/Đăng ký</a>`;
            const loginMobileHTML = `<a href="login.html" class="block bg-white text-[#5bb6d0] mx-10 py-1 rounded-full font-bold">Đăng nhập</a>`;

            if (userLinkDesktop) userLinkDesktop.innerHTML = loginHTML;
            if (userLinkMobile) userLinkMobile.innerHTML = loginMobileHTML;
        }
    });

        // Lấy ID từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        // --- HÀM 1: Đổi ảnh khi bấm vào thumbnail ---
        window.changeMainImage = function(src) {
            const mainImg = document.getElementById('mainImageDisplay');
            if(mainImg) {
                mainImg.src = src;
            }
        }

        // --- HÀM 2: Tải chi tiết sản phẩm ---
        async function loadProductDetail() {
            const container = document.getElementById("detailContainer");
            try {
                // Gọi API lấy dữ liệu
                const p = await API.getProductById(productId);
                const price = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(p.price);

                // 1. TẠO ALBUM ẢNH (Gom ảnh chính và ảnh phụ lại)
                // Lọc bỏ những cái nào rỗng hoặc undefined
                const listImages = [p.image, p.image1, p.image2, p.image3].filter(img => img); 
                
                // Tạo HTML cho hàng ảnh nhỏ
                let thumbnailsHtml = '';
                listImages.forEach(img => {
                    thumbnailsHtml += `
                        <div onclick="window.changeMainImage('${img}')" 
                             class="w-20 h-20 flex-shrink-0 rounded-lg overflow-hidden border border-gray-200 cursor-pointer hover:border-[#5bb6d0] hover:border-2 transition">
                            <img src="${img}" class="w-full h-full object-cover">
                        </div>
                    `;
                });

                // 2. HIỂN THỊ RA MÀN HÌNH
                container.innerHTML = `
                    <!-- Cột Trái: Album Ảnh -->
                    <div class="w-full">
                        <!-- Ảnh Lớn -->
                        <div class="w-full h-[400px] md:h-[500px] overflow-hidden rounded-2xl shadow-lg border border-gray-100 mb-4 bg-white flex items-center justify-center">
                            <img id="mainImageDisplay" src="${p.image}" class="w-full h-full object-contain" alt="${p.name}">
                        </div>
                        
                        <!-- Hàng Ảnh Nhỏ -->
                        <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
                            ${thumbnailsHtml}
                        </div>
                    </div>

                    <!-- Cột Phải: Thông tin -->
                    <div class="flex flex-col justify-center">
                        <span class="text-[#5bb6d0] font-bold uppercase tracking-wider mb-2 text-sm">Hải sản Dũng Kiều</span>
                        <h1 class="text-4xl md:text-5xl font-serif-viet font-bold text-gray-900 mb-4">${p.name}</h1>
                        <p class="text-3xl font-bold text-red-600 mb-6">${price} <span class="text-gray-400 text-lg font-normal">/ ${p.weight || '1kg'}</span></p>
                        
                        <div class="bg-gray-50 p-6 rounded-xl border border-gray-100 mb-8">
                            <h3 class="font-bold text-gray-800 mb-2">Mô tả sản phẩm:</h3>
                            <p class="text-gray-600 leading-relaxed text-lg">${p.description || 'Sản phẩm tươi ngon, phơi 1 nắng chuẩn vị nhà làm. Không chất bảo quản.'}</p>
                        </div>

                        <!-- Nút mua hàng -->
                        <div class="mt-auto">
                            <button onclick='window.Cart.addToCart(${JSON.stringify(p).replace(/"/g, '&quot;')})' 
                                class="w-full bg-black text-white py-4 rounded-full font-bold uppercase tracking-widest hover:bg-[#5bb6d0] transition shadow-lg transform hover:scale-105 flex items-center justify-center gap-3">
                                <i class="fas fa-shopping-bag"></i> Thêm vào giỏ hàng
                            </button>
                        </div>
                    </div>
                `;
            } catch (error) {
                container.innerHTML = "<p class='text-center text-red-500'>Không tìm thấy sản phẩm này hoặc lỗi kết nối.</p>";
                console.error(error);
            }
        }

        // Chạy hàm
        if(productId) {
            loadProductDetail();
        } else {
            document.getElementById("detailContainer").innerHTML = "<p class='text-center'>Đường dẫn sai.</p>";
        }
    </script>
</body>
</html>
