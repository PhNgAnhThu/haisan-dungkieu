<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Lịch sử đơn hàng - Dũng Kiều </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .font-script { font-family: 'Pinyon Script', cursive; }
        .font-serif-viet { font-family: 'Lora', serif; }
        .font-body { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body class="font-body bg-[#fdfbf7] text-gray-800 flex flex-col min-h-screen">

    <!-- BANNER (GIỐNG HÌNH CANVA) -->
   <!-- BANNER (ĐÃ SỬA CHIỀU CAO TỰ ĐỘNG) -->
    <!-- Sửa: h-[300px] thành min-h-[300px] hoặc h-auto py-20 -->
    <!-- BANNER SẢN PHẨM (ĐÃ CHỈNH KHÍT LẠI GIỐNG TRANG CHỦ) -->
    <!-- Giảm chiều cao xuống h-[350px] cho gọn -->
   <!-- BANNER (GIỐNG HÌNH CANVA) -->
    <header class="relative w-full h-[300px] bg-cover bg-center flex flex-col justify-center items-center text-center text-white" 
            style="background-image: url('https://i.postimg.cc/4NbMH428/ocean.jpg');">
        <div class="absolute inset-0 bg-blue-900/40"></div>
            <div class="relative z-10 px-4">
                <p class="text-lg uppercase tracking-[0.2em]">Chào mừng bạn đến với</p>
            <h1 class="text-6xl md:text-9xl font-script mb-2">Dũng Kiều</h1>
                <p class="text-lg uppercase tracking-[0.2em] font-bold border-t border-b border-white/50 py-2 inline-block">Cửa hàng hải sản khô và 1 nắng</p>
        </div>
    </header>

    <!-- MENU -->
    <!-- MENU RESPONSIVE (XỊN XÒ) -->
    <nav class="bg-[#5bb6d0] text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center py-3">
                
                <!-- Logo / Tên Shop (Luôn hiện) -->
                <a href="index.html" class="text-2xl font-script font-bold">Dũng Kiều</a>

                <!-- Nút 3 gạch (Chỉ hiện trên Mobile) -->
                <button onclick="document.getElementById('mobileMenu').classList.toggle('hidden')" class="md:hidden focus:outline-none">
                    <i class="fas fa-bars text-2xl"></i>
                </button>

                <!-- Menu Desktop (Ẩn trên Mobile, Hiện trên Máy tính) -->
                <!-- Menu Desktop -->
                <ul class="hidden md:flex space-x-8 text-xl font-script items-center">
                    <li><a href="index.html" class="hover:text-gray-100 transition">Trang chủ</a></li>
                    <li><a href="products.html" class="hover:text-gray-100 transition">Sản phẩm</a></li>
                    <li><a href="cart.html" class="hover:text-gray-100 transition">Giỏ hàng</a></li>
                    <li><a href="order-history.html" class="font-bold border-b-2 border-white transition">Lịch sử đơn</a></li>
                    <li id="userLink_Desktop">
                        <a href="login.html" class="hover:text-gray-100 transition">Đăng nhập/Đăng ký</a>
                    </li>
                </ul>
            </div>

            <!-- Menu Mobile (Xổ xuống khi bấm nút) -->
            <div id="mobileMenu" class="hidden md:hidden pb-4 border-t border-white/20">
                <ul class="flex flex-col space-y-3 mt-3 text-lg font-script text-center">
                    <li><a href="index.html" class="block hover:bg-white/20 py-1 rounded">Trang chủ</a></li>
                    <li><a href="products.html" class="block hover:bg-white/20 py-1 rounded">Sản phẩm</a></li>
                    <li><a href="cart.html" class="block hover:bg-white/20 py-1 rounded">Giỏ hàng</a></li>
                    <li><a href="order-history.html" class="block hover:bg-white/20 py-1 rounded">Lịch sử đơn</a></li>
                    <li id="userLink_Mobile">
                        <a href="login.html" class="block bg-white text-[#5bb6d0] mx-10 py-1 rounded-full font-bold">Đăng nhập</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="max-w-4xl mx-auto px-4 py-10">
        <h1 class="text-3xl font-serif-viet font-bold text-center mb-8 uppercase">Đơn hàng của tui</h1>
        
        <div id="historyList" class="space-y-6">
            <p class="text-center text-gray-500 py-10">Đang tải lịch sử...</p>
        </div>
    </main>

    <script type="module">
        import * as API from "./api.js";
 // --- 1. XỬ LÝ ĐĂNG NHẬP / ĐỔI MENU ---
   // --- 1. XỬ LÝ ĐĂNG NHẬP / ĐỔI MENU (CODE CHUẨN CHO CẢ MOBILE & DESKTOP) ---
    API.checkLoginStatus((user) => {
        // Lấy cả 2 cái menu (Máy tính và Điện thoại)
        const userLinkDesktop = document.getElementById("userLink_Desktop");
        const userLinkMobile = document.getElementById("userLink_Mobile");

        if (user) {
            const name = user.email.split('@')[0];

            // 1. CẬP NHẬT MENU MÁY TÍNH
            if (userLinkDesktop) {
                userLinkDesktop.innerHTML = `
                    <div class="relative group cursor-pointer h-full flex items-center">
                        <span class="font-bold border-b border-transparent group-hover:border-white pb-1">
                            Chào, ${name}
                        </span>
                        <!-- MENU THẢ XUỐNG -->
                        <div class="absolute right-0 top-full pt-4 w-56 hidden group-hover:block z-50">
                            <div class="bg-white text-black shadow-xl rounded-lg overflow-hidden border border-gray-100">
                                <div class="absolute -top-2 right-4 w-4 h-4 bg-white transform rotate-45 border-l border-t border-gray-100"></div>
                                <a href="order-history.html" class="block px-4 py-3 hover:bg-gray-50 border-b flex items-center gap-2">
                                    <i class="fas fa-box text-[#5bb6d0]"></i> Đơn hàng của tui
                                </a>
                                <button onclick="window.handleLogout()" class="block w-full text-left px-4 py-3 hover:bg-red-50 text-red-600 font-bold flex items-center gap-2">
                                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // 2. CẬP NHẬT MENU ĐIỆN THOẠI (Làm đơn giản hơn cho đỡ rối)
            if (userLinkMobile) {
                userLinkMobile.innerHTML = `
                    <div class="flex flex-col gap-2">
                        <span class="text-gray-500 text-sm">Chào, ${name}</span>
                        <button onclick="window.handleLogout()" class="bg-red-500 text-white py-1 px-4 rounded-full font-bold mx-auto">Đăng xuất</button>
                    </div>
                `;
            }

            // Hàm đăng xuất chung
            window.handleLogout = async () => {
                await API.logout();
                window.location.reload();
            }

        } else {
            // CHƯA ĐĂNG NHẬP -> HIỆN NÚT LOGIN NHƯ CŨ
            const loginHTML = `<a href="login.html" class="hover:text-gray-100 transition">Đăng nhập/Đăng ký</a>`;
            const loginMobileHTML = `<a href="login.html" class="block bg-white text-[#5bb6d0] mx-10 py-1 rounded-full font-bold">Đăng nhập</a>`;

            if (userLinkDesktop) userLinkDesktop.innerHTML = loginHTML;
            if (userLinkMobile) userLinkMobile.innerHTML = loginMobileHTML;
        }
    });

        // Kiểm tra đăng nhập
        API.checkLoginStatus(async (user) => {
            const list = document.getElementById("historyList");
            const authLink = document.getElementById("authLink");

            if (!user) {
                list.innerHTML = `
                    <div class="text-center">
                        <p class="mb-4">Bà chưa đăng nhập sao xem được nè!</p>
                        <a href="login.html" class="bg-black text-white px-6 py-2 rounded-full font-bold">Đăng nhập ngay</a>
                    </div>
                `;
                return;
            }

            // Đổi nút đăng nhập thành đăng xuất
            authLink.innerHTML = `<button onclick="API.logout(); window.location.reload()">Đăng xuất (${user.email})</button>`;
            
            // Gán API logout ra ngoài để nút bấm được
            window.API = API; 

            // Tải đơn hàng
            try {
                const orders = await API.getMyOrders(user.uid);
                
                if (orders.length === 0) {
                    list.innerHTML = "<p class='text-center text-gray-500'>Chưa mua đơn nào hết trơn á.</p>";
                    return;
                }

                list.innerHTML = "";
                orders.forEach(order => {
                    const date = order.created_at_web ? new Date(order.created_at_web).toLocaleString('vi-VN') : 'Vừa xong';
                    const total = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(order.total_price);
                    
                    let statusClass = "bg-yellow-100 text-yellow-800";
                    let statusText = "Đang chờ xử lý";
                    if (order.status === 'shipped') {
                        statusClass = "bg-green-100 text-green-800";
                        statusText = "Đã giao thành công";
                    }

                    // Render danh sách món
                    let itemsHtml = order.items.map(i => `
                        <div class="flex gap-4 mb-2">
                            <img src="${i.image}" class="w-16 h-16 object-cover rounded border">
                            <div>
                                <p class="font-bold">${i.name}</p>
                                <p class="text-sm text-gray-500">x${i.quantity}</p>
                            </div>
                        </div>
                    `).join('');

             // Xử lý hiển thị trạng thái tiền cho khéo léo
                    let paymentStatusDisplay = '';
                    
                    if (order.payment_status === 'paid') {
                        // Trường hợp 1: Bà đã bấm nút xác nhận trong Admin
                        paymentStatusDisplay = `
                            <p class="text-xs text-green-600 font-bold mt-2 bg-green-50 border border-green-200 p-1 rounded inline-block">
                                <i class="fas fa-check-double"></i> Shop đã nhận tiền
                            </p>`;
                    } else {
                        // Trường hợp 2: Khách đã bấm chuyển khoản, nhưng bà chưa check
                        paymentStatusDisplay = `
                            <p class="text-xs text-orange-500 font-bold mt-2 bg-orange-50 border border-orange-200 p-1 rounded inline-block">
                                <i class="fas fa-clock"></i> Đang chờ Shop check khoản
                            </p>`;
                    }

                    list.innerHTML += `
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition">
                            <div class="flex justify-between items-start mb-4 border-b pb-4">
                                <div>
                                    <p class="text-sm text-gray-500 mb-1">Ngày đặt: ${date}</p>
                                    
                                    <p class="text-sm font-bold text-gray-700 mb-2">
                                        <i class="fas fa-map-marker-alt text-[#5bb6d0] mr-1"></i> 
                                        ${order.user_info.address}
                                    </p>

                                    <span class="inline-block px-3 py-1 rounded-full text-xs font-bold ${statusClass}">${statusText}</span>
                                </div>
                                <div class="text-right">
                                    <p class="font-bold text-red-600 text-xl">${total}</p>
                                    
                                    <!-- Hiện trạng thái thanh toán ở đây -->
                                    ${paymentStatusDisplay}
                                </div>
                            </div>
                            
                            <div class="space-y-3">
                                ${itemsHtml}
                            </div>
                        </div>
                    `;
                });

            } catch (err) {
                console.error(err);
                list.innerHTML = "<p class='text-center text-red-500'>Lỗi tải dữ liệu.</p>";
            }
        });
    </script>
</body>
</html>
